name: NCR-001 prototype tests
on:
  pull_request:
    paths:
      - 'gbe-genesis-engine/modules/neural-civilization-rebuilder/**'
      - '.github/workflows/ncr-001-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run NCR unit tests
        working-directory: gbe-genesis-engine/modules/neural-civilization-rebuilder
        run: python -m unittest -v test_ncr.py test_receipt.py test_evidence.py
